[tool.poetry]
name = "heart-disease-prediction"
version = "0.1.0"
description = "End-to-end MLOps project for heart disease prediction"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.9,<3.11"
scikit-learn = "1.3.0"
pandas = "2.0.3"
numpy = "1.24.3"
mlflow = "2.4.1"
prefect = "2.11.3"
fastapi = "0.100.0"
uvicorn = "0.22.0"
python-dotenv = "1.0.0"
evidently = "0.4.0"
seaborn = "0.13.2"
localstack = "4.6.0"
boto3 = "1.39.3"
awscli-local = "0.22.0"
requests = "2.31.0"
scipy = "1.10.1"
plotly = "5.18.0"
python-multipart = "0.0.6"
slack-sdk = "3.26.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.0"
black = "23.3.0"
pylint = "2.17.4"
pre-commit = "3.3.3"
jupyter = "1.0.0"
pytest-cov = "4.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/docs
'''

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "C0330",  # bad-continuation
    "C0326",  # bad-whitespace
    "W0511",  # fixme
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.basic]
good-names = ["df", "id", "x", "y", "X", "Y"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = ["docs"]

[tool.bandit]
exclude_dirs = ["tests", "notebooks"]
skips = ["B101"]  # assert statements
targets = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
