<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elephant on a Bike — Animated</title>
<style>
  html,body{margin:0;background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif}
  figure{margin:0}
  svg{width:min(95vw,1000px);height:auto;display:block;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  figcaption{color:#888;text-align:center;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ============ GRADIENTS ============ -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec3e8"/>
      <stop offset="55%" stop-color="#cfeaf6"/>
      <stop offset="100%" stop-color="#f3e6c4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.18" r="0.55">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#9a958a"/>
      <stop offset="60%" stop-color="#6f6a60"/>
      <stop offset="100%" stop-color="#4a463e"/>
    </radialGradient>
    <linearGradient id="tusk" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#e8dcc0"/>
    </linearGradient>
    <linearGradient id="redframe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef3b2d"/>
      <stop offset="50%" stop-color="#c81e16"/>
      <stop offset="100%" stop-color="#8c120c"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>

    <!-- ============ COBBLESTONE PATTERN (width 140 = scroll step) ============ -->
    <pattern id="cobbles" x="0" y="0" width="140" height="96" patternUnits="userSpaceOnUse">
      <rect width="140" height="96" fill="#9a8f7d"/>
      <g fill="#b3a895" stroke="#6e6555" stroke-width="1.4">
        <ellipse cx="18"  cy="16" rx="16" ry="11"/>
        <ellipse cx="52"  cy="16" rx="16" ry="11"/>
        <ellipse cx="88"  cy="16" rx="16" ry="11"/>
        <ellipse cx="122" cy="16" rx="16" ry="11"/>
        <ellipse cx="35"  cy="36" rx="16" ry="11"/>
        <ellipse cx="70"  cy="36" rx="16" ry="11"/>
        <ellipse cx="105" cy="36" rx="16" ry="11"/>
        <ellipse cx="18"  cy="76" rx="16" ry="11"/>
        <ellipse cx="52"  cy="76" rx="16" ry="11"/>
        <ellipse cx="88"  cy="76" rx="16" ry="11"/>
        <ellipse cx="122" cy="76" rx="16" ry="11"/>
      </g>
      <g fill="#867a68" opacity="0.8">
        <circle cx="14"  cy="13" r="1"/>
        <circle cx="22"  cy="19" r="1.3"/>
        <circle cx="50"  cy="14" r="1"/>
        <circle cx="58"  cy="20" r="1.4"/>
        <circle cx="30"  cy="38" r="1.2"/>
        <circle cx="66"  cy="34" r="1"/>
        <circle cx="100" cy="40" r="1.3"/>
        <circle cx="118" cy="78" r="1.1"/>
      </g>
    </pattern>

    <!-- ============ REUSABLE SPOKED WHEEL (centered at 0,0) ============ -->
    <g id="wheel">
      <circle r="78" fill="none" stroke="#1a1a1a" stroke-width="9"/>
      <circle r="72" fill="none" stroke="#e8e8e8" stroke-width="2.5"/>
      <circle r="10" fill="#2a2a2a"/>
      <circle r="3" fill="#999"/>
      <g stroke="#cfcfcf" stroke-width="1.6">
        <line x1="0"   y1="-72" x2="0"   y2="72"/>
        <line x1="-72" y1="0"   x2="72"  y2="0"/>
        <line x1="-51" y1="-51" x2="51"  y2="51"/>
        <line x1="51"  y1="-51" x2="-51" y2="51"/>
        <line x1="-38" y1="-62" x2="38"  y2="62"/>
        <line x1="62"  y1="-38" x2="-62" y2="38"/>
      </g>
    </g>

    <!-- ============ REUSABLE CITY BLOCK (exactly 1000 wide = seamless loop) ============ -->
    <g id="cityBlock">
      <rect x="0"   y="250" width="160" height="180" fill="#caa98a"/>
      <polygon points="0,250 80,205 160,250" fill="#9c6f54"/>
      <rect x="160" y="230" width="120" height="200" fill="#d9b89a"/>
      <polygon points="160,230 220,190 280,230" fill="#a87a5a"/>
      <rect x="280" y="245" width="140" height="185" fill="#c79a7a"/>
      <polygon points="280,245 350,200 420,245" fill="#8a5e44"/>
      <rect x="420" y="260" width="100" height="170" fill="#b88a6c"/>
      <rect x="540" y="180" width="70"  height="250" fill="#b08068"/>
      <polygon points="540,180 575,130 610,180" fill="#6e4a36"/>
      <rect x="565" y="220" width="20"  height="84"  fill="#3a4a5a"/>
      <rect x="620" y="255" width="120" height="175" fill="#cba587"/>
      <polygon points="620,255 680,215 740,255" fill="#946548"/>
      <rect x="740" y="240" width="130" height="190" fill="#d2ae8e"/>
      <polygon points="740,240 805,200 870,240" fill="#9c6f54"/>
      <rect x="870" y="260" width="130" height="170" fill="#c79a7a"/>
      <g fill="#3a4a5a">
        <rect x="25"  y="290" width="18" height="26"/>
        <rect x="70"  y="290" width="18" height="26"/>
        <rect x="25"  y="340" width="18" height="26"/>
        <rect x="70"  y="340" width="18" height="26"/>
        <rect x="185" y="270" width="16" height="22"/>
        <rect x="225" y="270" width="16" height="22"/>
        <rect x="185" y="320" width="16" height="22"/>
        <rect x="225" y="320" width="16" height="22"/>
        <rect x="640" y="290" width="16" height="22"/>
        <rect x="685" y="290" width="16" height="22"/>
        <rect x="640" y="335" width="16" height="22"/>
        <rect x="685" y="335" width="16" height="22"/>
        <rect x="765" y="285" width="16" height="22"/>
        <rect x="805" y="285" width="16" height="22"/>
        <rect x="765" y="330" width="16" height="22"/>
        <rect x="805" y="330" width="16" height="22"/>
        <rect x="895" y="295" width="16" height="22"/>
        <rect x="945" y="295" width="16" height="22"/>
        <rect x="895" y="345" width="16" height="22"/>
        <rect x="945" y="345" width="16" height="22"/>
      </g>
    </g>

    <!-- ============ REUSABLE CLOUD SET (1000 wide = seamless loop) ============ -->
    <g id="cloudSet" fill="#ffffff" opacity="0.85">
      <g transform="translate(120,90)">
        <ellipse cx="0"  cy="0"   rx="45" ry="16"/>
        <ellipse cx="30" cy="-10" rx="32" ry="14"/>
        <ellipse cx="-25" cy="-10" rx="28" ry="12"/>
      </g>
      <g transform="translate(520,130)">
        <ellipse cx="0"  cy="0"   rx="50" ry="18"/>
        <ellipse cx="35" cy="-12" rx="34" ry="15"/>
      </g>
      <g transform="translate(880,110)">
        <ellipse cx="0"  cy="0"   rx="40" ry="15"/>
        <ellipse cx="28" cy="-8"  rx="28" ry="12"/>
      </g>
    </g>

    <!-- ============ ANIMATIONS ============ -->
    <!-- Robust pattern (per MDN/DockYard): wrap rotating element in a
         <g transform="translate(cx,cy)"> and draw child geometry around 0,0,
         so transform-origin:0 0 + view-box reference is consistent across
         Chrome, Firefox and Safari. fill-box is avoided where possible. -->
    <style>
      .spin        { transform-origin:0 0; animation:spin .55s linear infinite; }
      #streetScroll{ animation:scrollStreet .6s linear infinite; }
      #buildings   { animation:drift 18s linear infinite; }
      #clouds      { animation:drift 30s linear infinite; }
      #rider       { transform-origin:0 0; animation:bob .55s ease-in-out infinite; }
      #legA        { transform-origin:0 0; animation:pedal .55s linear infinite; }
      #legB        { transform-origin:0 0; animation:pedal .55s linear infinite; animation-delay:-.275s; }
      #crank       { transform-origin:0 0; animation:spin .55s linear infinite; }

      /* Ear / tail / trunk pivot from an attachment point inside their own
         bbox, so fill-box + percentage origin is the right tool here. */
      #ear         { transform-box:fill-box; transform-origin:90% 20%; animation:flap 1.1s ease-in-out infinite; }
      #tail        { transform-box:fill-box; transform-origin:78% 0%;  animation:swish 1s ease-in-out infinite; }
      #trunk       { transform-box:fill-box; transform-origin:27% 0%;  animation:wave 1.6s ease-in-out infinite; }
      #sunGlow     { transform-box:fill-box; transform-origin:center;  animation:pulse 4s ease-in-out infinite; }

      @keyframes spin          { to   { transform:rotate(360deg); } }
      @keyframes scrollStreet  { to   { transform:translateX(-140px); } }
      @keyframes drift         { to   { transform:translateX(-1000px); } }
      @keyframes bob           { 0%,100%{transform:translateY(0);}     50%{transform:translateY(-5px);} }
      @keyframes pedal         { 0%,100%{transform:rotate(-22deg);}    50%{transform:rotate(22deg);} }
      @keyframes flap          { 0%,100%{transform:rotate(0deg);}      50%{transform:rotate(-12deg);} }
      @keyframes swish         { 0%,100%{transform:rotate(-4deg);}     50%{transform:rotate(6deg);} }
      @keyframes wave          { 0%,100%{transform:rotate(0deg);}      50%{transform:rotate(-5deg);} }
      @keyframes pulse         { 0%,100%{opacity:.35; transform:scale(1);} 50%{opacity:.55; transform:scale(1.08);} }

      @media (prefers-reduced-motion: reduce) {
        .spin,#streetScroll,#buildings,#clouds,#rider,#legA,#legB,
        #crank,#ear,#tail,#trunk,#sunGlow { animation:none !important; }
      }
    </style>
  </defs>

  <!-- ===== SKY ===== -->
  <rect x="0" y="0" width="1000" height="430" fill="url(#sky)"/>
  <rect x="0" y="0" width="1000" height="430" fill="url(#sun)"/>

  <!-- Sun -->
  <g id="sunGlow"><circle cx="780" cy="120" r="60" fill="#fff7c8"/></g>
  <circle cx="780" cy="120" r="42" fill="#fffdf0"/>

  <!-- ===== CLOUDS (seamless parallax) ===== -->
  <g id="clouds">
    <use href="#cloudSet"/>
    <use href="#cloudSet" transform="translate(1000,0)"/>
  </g>

  <!-- ===== BUILDINGS (seamless parallax) ===== -->
  <g id="buildings" opacity="0.85">
    <use href="#cityBlock"/>
    <use href="#cityBlock" transform="translate(1000,0)"/>
  </g>

  <!-- ===== STREET (seamless scroll) ===== -->
  <rect x="0" y="420" width="1000" height="280" fill="#9a8f7d"/>
  <g id="streetScroll">
    <rect x="-140" y="420" width="1280" height="280" fill="url(#cobbles)"/>
  </g>
  <polygon points="0,420 1000,420 1000,520 0,560" fill="#ffe6b0" opacity="0.18"/>

  <!-- ===== GROUND SHADOW ===== -->
  <ellipse cx="510" cy="600" rx="240" ry="34" fill="url(#shadow)"/>

  <!-- ===== RIDER GROUP (bobs up & down) ===== -->
  <g id="rider">

    <!-- ===== BICYCLE ===== -->
    <g transform="translate(330,560)">
      <g class="spin"><use href="#wheel"/></g>
    </g>
    <g transform="translate(700,560)">
      <g class="spin"><use href="#wheel"/></g>
    </g>

    <!-- Frame -->
    <g fill="none" stroke="url(#redframe)" stroke-width="13" stroke-linecap="round">
      <line x1="330" y1="560" x2="540" y2="430"/>
      <line x1="540" y1="430" x2="510" y2="560"/>
      <line x1="540" y1="430" x2="700" y2="430"/>
      <line x1="700" y1="430" x2="700" y2="560"/>
      <line x1="510" y1="560" x2="330" y2="560"/>
    </g>
    <g fill="none" stroke="#ff6a5a" stroke-width="3" opacity="0.7" stroke-linecap="round">
      <line x1="338" y1="556" x2="538" y2="436"/>
      <line x1="544" y1="436" x2="514" y2="556"/>
    </g>

    <!-- Handlebar -->
    <line x1="700" y1="430" x2="690" y2="370" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round"/>
    <line x1="650" y1="365" x2="730" y2="365" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round"/>
    <line x1="650" y1="365" x2="650" y2="378" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round"/>
    <line x1="730" y1="365" x2="730" y2="378" stroke="#2a2a2a" stroke-width="8" stroke-linecap="round"/>

    <!-- Seat -->
    <line x1="540" y1="430" x2="540" y2="395" stroke="#2a2a2a" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="540" cy="390" rx="38" ry="10" fill="#1a1a1a"/>

    <!-- Chain -->
    <path d="M 332,560 L 510,544 M 332,560 L 510,576" stroke="#5a5a5a" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- ===== ELEPHANT ===== -->
    <!-- Body -->
    <ellipse cx="470" cy="350" rx="150" ry="120" fill="url(#skin)"/>
    <ellipse cx="470" cy="430" rx="120" ry="55" fill="#5d594f"/>

    <!-- Wrinkles -->
    <g fill="none" stroke="#3d3a33" stroke-width="2" opacity="0.55" stroke-linecap="round">
      <path d="M 360,310 Q 400,318 440,312"/>
      <path d="M 350,345 Q 400,355 455,346"/>
      <path d="M 355,380 Q 410,392 470,380"/>
      <path d="M 380,415 Q 440,428 505,414"/>
      <path d="M 420,445 Q 480,458 545,442"/>
      <path d="M 510,300 Q 560,310 600,300"/>
      <path d="M 520,335 Q 575,346 615,334"/>
    </g>

    <!-- Rear pedaling leg (behind, darker). Pivot = hip (510,430) via translate. -->
    <g transform="translate(510,430)">
      <g id="legB">
        <line x1="0" y1="0" x2="-30" y2="95" stroke="#4a463e" stroke-width="24" stroke-linecap="round"/>
        <rect x="-43" y="88" width="26" height="9" rx="3" fill="#222"/>
      </g>
    </g>

    <!-- Front (standing) leg -->
    <path d="M 545,400 Q 540,470 560,520 Q 570,545 600,565 L 622,558 Q 605,535 595,510 Q 580,470 585,420 Z" fill="url(#skin)"/>
    <ellipse cx="612" cy="568" rx="20" ry="11" fill="#3d3a33"/>
    <ellipse cx="612" cy="565" rx="14" ry="6" fill="#5b574d"/>

    <!-- Head -->
    <ellipse cx="620" cy="320" rx="92" ry="82" fill="url(#skin)"/>
    <g fill="none" stroke="#3d3a33" stroke-width="2" opacity="0.5" stroke-linecap="round">
      <path d="M 555,280 Q 600,288 645,280"/>
      <path d="M 560,310 Q 610,320 660,310"/>
      <path d="M 565,345 Q 615,355 665,345"/>
    </g>

    <!-- Ear (flapping) -->
    <g id="ear">
      <path d="M 560,250 Q 470,235 450,300 Q 445,360 520,370 Q 545,360 560,320 Z" fill="url(#skin)"/>
      <path d="M 540,265 Q 480,260 475,305 Q 478,345 520,355 Q 535,345 540,315 Z" fill="#4a463e" opacity="0.5"/>
      <path d="M 560,250 Q 470,235 450,300 Q 445,360 520,370" fill="none" stroke="#2c2a24" stroke-width="2.5"/>
    </g>

    <!-- Trunk (waving) -->
    <g id="trunk">
      <path d="M 690,330 Q 760,360 770,420 Q 768,470 720,460 Q 700,452 705,440 Q 730,448 740,425 Q 738,395 695,380 Q 670,372 660,355 Z" fill="url(#skin)"/>
      <g fill="none" stroke="#3d3a33" stroke-width="1.8" opacity="0.6" stroke-linecap="round">
        <path d="M 700,345 Q 740,360 758,380"/>
        <path d="M 712,365 Q 745,378 762,400"/>
      </g>
      <path d="M 705,440 Q 712,452 722,452 Q 718,446 714,442 Z" fill="#3d3a33"/>
    </g>

    <!-- Tusk -->
    <path d="M 670,360 Q 740,392 800,430 Q 808,438 800,442 Q 735,420 660,388 Z" fill="url(#tusk)" stroke="#cdbf9e" stroke-width="1.5"/>
    <path d="M 670,360 Q 740,392 800,430" fill="none" stroke="#f4ecd6" stroke-width="2.5" opacity="0.7"/>

    <!-- Eye -->
    <ellipse cx="650" cy="305" rx="9" ry="8" fill="#1a1a1a"/>
    <circle cx="653" cy="302" r="2.5" fill="#fff"/>
    <path d="M 635,290 Q 655,283 672,292" fill="none" stroke="#2c2a24" stroke-width="2" opacity="0.6"/>

    <!-- Tail (swishing) -->
    <g id="tail">
      <path d="M 330,360 Q 305,380 300,415 Q 298,425 305,428 Q 313,425 317,415 Q 323,388 340,370 Z" fill="url(#skin)"/>
      <line x1="303" y1="425" x2="295" y2="440" stroke="#3d3a33" stroke-width="3"/>
      <line x1="305" y1="427" x2="301" y2="443" stroke="#3d3a33" stroke-width="3"/>
    </g>

    <!-- Body highlight -->
    <ellipse cx="560" cy="260" rx="80" ry="40" fill="#ffffff" opacity="0.10"/>
    <ellipse cx="640" cy="270" rx="40" ry="25" fill="#fff7d6" opacity="0.15"/>

    <!-- ===== CRANK (spins around bottom bracket 510,560) ===== -->
    <g transform="translate(510,560)">
      <g id="crank">
        <line x1="0"  y1="0"  x2="30"  y2="35"  stroke="#444" stroke-width="6" stroke-linecap="round"/>
        <line x1="0"  y1="0"  x2="-30" y2="-35" stroke="#444" stroke-width="6" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="16" fill="#2a2a2a" stroke="#888" stroke-width="2"/>
        <circle cx="0" cy="0" r="3" fill="#999"/>
      </g>
    </g>

    <!-- ===== FRONT PEDALING LEG (pivot at hip 510,430) ===== -->
    <g transform="translate(510,430)">
      <g id="legA">
        <line x1="0" y1="0" x2="30" y2="135" stroke="#6f6a60" stroke-width="24" stroke-linecap="round"/>
        <rect x="18" y="128" width="26" height="9" rx="3" fill="#222"/>
      </g>
    </g>
  </g>

  <!-- ===== VIGNETTE ===== -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#vig)" pointer-events="none"/>
</svg>
<figcaption>Animated SVG — spinning wheels &amp; crank, pedaling legs, flapping ear, swishing tail, waving trunk, seamless scrolling street &amp; parallax</figcaption>
</figure>
</body>
</html>
