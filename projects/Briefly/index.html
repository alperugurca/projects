<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Briefly - Article Simplifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=briefly-3" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Application header">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <i data-lucide="sparkles"></i>
          </div>
          <div>
            <h1>Briefly</h1>
            <p>Professional article simplifier</p>
          </div>
        </div>

        <div class="top-actions">
          <span class="key-status" id="keyStatus">
            <i data-lucide="key-round"></i>
            <span>API key needed</span>
          </span>
          <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings">
            <i data-lucide="settings"></i>
          </button>
        </div>
      </header>

      <section class="workspace" aria-label="Article simplifier workspace">
        <section class="panel input-panel" aria-labelledby="inputTitle">
          <div class="panel-header">
            <div>
              <h2 id="inputTitle">Original Article</h2>
              <p id="inputMeta">0 characters</p>
            </div>
            <div class="header-actions">
              <button class="ghost-button" id="sampleButton" type="button">
                <i data-lucide="file-input"></i>
                <span>Sample</span>
              </button>
              <button class="ghost-button" id="clearButton" type="button">
                <i data-lucide="x"></i>
                <span>Clear</span>
              </button>
            </div>
          </div>

          <label class="sr-only" for="articleInput">Paste article text</label>
          <textarea
            id="articleInput"
            spellcheck="true"
            placeholder="Paste a dense article, report, policy memo, or research excerpt..."
          ></textarea>

          <div class="control-strip" aria-label="Simplification options">
            <fieldset class="segmented-control">
              <legend>Audience</legend>
              <label>
                <input type="radio" name="audience" value="general" checked />
                <span>General</span>
              </label>
              <label>
                <input type="radio" name="audience" value="executive" />
                <span>Executive</span>
              </label>
              <label>
                <input type="radio" name="audience" value="student" />
                <span>Student</span>
              </label>
            </fieldset>

            <div class="select-control">
              <label for="detailSelect">Depth</label>
              <select id="detailSelect">
                <option value="balanced" selected>Balanced</option>
                <option value="brief">Brief</option>
                <option value="detailed">Detailed</option>
              </select>
            </div>

            <label class="toggle-row" for="analogiesInput">
              <input id="analogiesInput" type="checkbox" checked />
              <span>Analogies</span>
            </label>
          </div>

          <div class="action-row">
            <button class="primary-button" id="simplifyButton" type="button">
              <span class="spinner" aria-hidden="true"></span>
              <i data-lucide="wand-sparkles" class="button-icon"></i>
              <span class="button-label">Simplify Article</span>
            </button>
            <p class="status-text" id="statusText" role="status" aria-live="polite"></p>
          </div>
        </section>

        <section class="panel output-panel" aria-labelledby="outputTitle">
          <div class="panel-header">
            <div>
              <h2 id="outputTitle">Simplified Article</h2>
              <p id="outputMeta">Ready when you are</p>
            </div>
            <div class="header-actions">
              <button class="ghost-button" id="downloadButton" type="button" disabled>
                <i data-lucide="download"></i>
                <span>Download</span>
              </button>
              <button class="ghost-button" id="copyButton" type="button" disabled>
                <i data-lucide="copy"></i>
                <span>Copy</span>
              </button>
            </div>
          </div>

          <div class="output-surface" id="outputSurface" aria-live="polite">
            <div class="placeholder">
              <div class="placeholder-art" aria-hidden="true">
                <div class="document-shape">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
                <div class="summary-chip">
                  <i data-lucide="check"></i>
                </div>
              </div>
              <p>Your simplified article will appear here.</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <form method="dialog" class="settings-panel">
        <div class="settings-header">
          <div>
            <h2 id="settingsTitle">Settings</h2>
            <p>Gemini connection</p>
          </div>
          <button class="icon-button" value="close" type="submit" aria-label="Close settings">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="field-stack">
          <label for="apiKeyInput">API key</label>
          <div class="password-field">
            <input
              id="apiKeyInput"
              type="password"
              placeholder="Paste Gemini API key"
              autocomplete="off"
              inputmode="text"
            />
            <button class="icon-button compact" id="toggleKeyButton" type="button" aria-label="Show API key">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <div class="field-stack">
          <label for="modelInput">Model</label>
          <input id="modelInput" type="text" value="gemini-2.5-flash" autocomplete="off" />
        </div>

        <label class="checkbox-row" for="rememberKeyInput">
          <input id="rememberKeyInput" type="checkbox" />
          <span>Remember key on this device</span>
        </label>

        <menu class="settings-actions">
          <button class="ghost-button" id="removeKeyButton" type="button">
            <i data-lucide="trash-2"></i>
            <span>Remove key</span>
          </button>
          <button class="primary-button small" value="close" type="submit">
            <i data-lucide="check"></i>
            <span>Done</span>
          </button>
        </menu>
      </form>
    </dialog>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="app.js?v=briefly-3"></script>
  </body>
</html>
